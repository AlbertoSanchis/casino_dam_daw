<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pares O Nones</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header>
      <h1>Pares O Nones</h1>
      <h2 id="sueldo">Balance:</h2>
    </header>
    <main>
      <form id="Apuestas">
        <div id="contenedorApuesta">
          <label for="">Cantidad a apostar</label>
          <input type="number" id="apuesta" />
          <button id="allIn" type="button">ALL IN LET IT RIDE</button>
          <input type="submit" id="apostar" value="apostar" />
        </div>
        <div id="contenedorApostado" style="display: none">
          <h2 id="h2contenedorApostado">Cantidad Apostada:</h2>
        </div>
      </form>
      <div id="typoElegir" style="display: none">
        <h2>Elige</h2>
        <form action="">
          <select id="tipo">
            <option value="Pares">Pares</option>
            <option value="Nones">Nones</option>
          </select>
          <input type="submit" id="enviarTipo" />
        </form>
      </div>
      <div id="typoElegido" style="display: none">
        <h2 id="h2TypoElegido">Typo Elegido:</h2>
        <div id="elegirNumero" style="display: none">
          <h2>Introduce numero del 0 al 5</h2>
          <form id="formJuego">
            <input
              type="number"
              value=""
              min="0"
              max="5"
              id="numeroElegido"
              required
            />
            <input type="submit" id="JuegoEmpezar" value="Empezar Juego" />
          </form>
        </div>
      </div>
      <div id="resultado" style="display: none">
        <h3 id="resultadoh3">Resultado</h3>
        <p id="tuNumero">Tu Numero:</p>
        <p id="numeroMaquina">Numero Casino:</p>
      </div>
      <button id="jugarNuevo" style="display: none">Jugar de Nuevo</button>
      <form action="" id="mandanga">
        <label for="">Añadir Mandanga</label>
        <input type="number" id="inputBalance" />
        <button id="DarBalance">Let it RIDE</button>
      </form>
      <button>Salir</button>
    </main>
    <script type="module" src="js/ui.js"></script>
  </body>
</html>
